name: Validate cases

on:
  # Every PR runs this, so it can be a required status check on main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'cases/**'
      - 'schema/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all cases against schema
        run: npm run validate

      - name: Dry-run build
        run: npm run build
