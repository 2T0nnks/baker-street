name: Validate cases

on:
  pull_request:
    paths:
      - 'cases/**'
      - 'schema/**'
      - 'scripts/validate.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'cases/**'
      - 'schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all cases against schema
        run: npm run validate

      - name: Dry-run build
        run: npm run build
